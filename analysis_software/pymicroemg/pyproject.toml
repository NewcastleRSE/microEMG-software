[tool.poetry]
name = "pymicroemg"
version = "0.1.0"
description = "Analysis library for multi-channel EMG recordings: motor unit identification, localisation, and jitter analysis"
authors = ["Gabrielle M. Schroeder <8205451+gmschroe@users.noreply.github.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/NewcastleRSE/microEMG-software"
repository = "https://github.com/NewcastleRSE/microEMG-software"
documentation = "https://newcastlerse.github.io/microEMG-software/"
keywords = ["EMG", "electromyography", "motor unit", "neuromuscular", "jitter"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
platformdirs = "^4.0"
numpy = "^1.26.3"
scipy = "^1.11.4"
matplotlib = "^3.8.2"
scikit-learn = "^1.5.0"
scikit-image = "^0.24.0"
seaborn = "^0.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
