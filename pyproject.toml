# Dev-only workspace config. External users should install the sub-packages directly:
#   pip install "git+https://github.com/NewcastleRSE/microEMG-software.git@v0.2.0#subdirectory=analysis_software/microemggui"
#   pip install "git+https://github.com/NewcastleRSE/microEMG-software.git@v0.2.0#subdirectory=analysis_software/pymicroemg"
[tool.poetry]
name = "microemg-software"
version = "0.1.0"
description = "Development workspace for microEMG-software — see sub-packages pymicroemg and microemggui for installable distributions"
authors = ["Gabrielle M. Schroeder <8205451+gmschroe@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
pymicroemg = {path = "analysis_software/pymicroemg", develop = true}
microemggui = {path = "analysis_software/microemggui", develop = true}

[tool.poetry.group.dev.dependencies]
black = "^24.4.0"
pre-commit = "^3.6.0"
mypy = "^1.8.0"
flake8 = "^7.0.0"
flake8-bugbear = "^24.1.17"
pytest = "^8.0.2"
pytest-qt = "^4.4.0"
pytest-check = "^2.3.1"
pdoc = "^14.6.0"
pyinstaller = "^6.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_subclassing_any = false
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_errors = true

[tool.black]
line-length = 99

[tool.pytest.ini_options]
markers = [
    "demo_data: test depends on the downloaded demo recording",
]